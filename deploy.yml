# Deploy the EAMS landing page and documentation to GitHub Pages.
# Auto-deploys on every push to the default branch (main) and on manual dispatch.
#
# Prerequisites in the repository Settings:
#   Settings > Pages > Build and deployment > Source = "GitHub Actions"
#
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; cancel any in-progress run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        # The whole repository root is the site: index.html is the entry,
        # and the database/, api/, docs/, scripts/ folders are served as static files.
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
