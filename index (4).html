<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EAMS — Ekub & Association Management System</title>
<meta name="description" content="A fully functional, browser-based Ekub and Association Management System — members, schemes, contributions, draws, distributions, and a self-balancing double-entry ledger.">
<style>
:root{
  --navy:#0F2A43; --navy-l:#1B3A57; --navy-d:#0a1f33; --teal:#1F7A8C;
  --emerald:#2F9E6B; --emerald-d:#248055; --bg:#F4F6F8; --card:#FFFFFF;
  --border:#D6DEE6; --text:#1A2230; --muted:#6B7785; --danger:#C0392B;
  --warn:#B7791F; --shadow:0 2px 10px rgba(15,42,67,.08);
  --shadow-lg:0 10px 30px rgba(15,42,67,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
code,.mono{font-family:"SFMono-Regular",Consolas,Menlo,monospace}
.hidden{display:none!important}

/* ===== Layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--navy);color:#cdd7e0;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:0;overflow-y:auto}
.brand{padding:1.2rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:.02em}
.brand .logo span{color:var(--emerald)}
.brand .sub{font-size:.72rem;color:#8aa0b8;margin-top:.15rem;text-transform:uppercase;letter-spacing:.08em}
.nav{padding:.6rem 0;flex:1}
.nav a{display:flex;align-items:center;gap:.6rem;padding:.6rem 1.1rem;color:#b9c6d6;
  font-size:.92rem;border-left:3px solid transparent;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff;text-decoration:none}
.nav a.active{background:rgba(47,158,107,.12);color:#fff;border-left-color:var(--emerald)}
.nav a .ic{width:18px;text-align:center;font-size:1rem}
.sidebar-foot{padding:.8rem 1.1rem;border-top:1px solid rgba(255,255,255,.08);font-size:.75rem;color:#7d93ab}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:.7rem 1.2rem;
  display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:20}
.topbar .burger{display:none;background:none;border:none;font-size:1.3rem;color:var(--navy)}
.topbar h1{font-size:1.1rem;color:var(--navy);font-weight:700;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .assoc-sel{background:var(--bg);border:1px solid var(--border);border-radius:6px;
  padding:.35rem .5rem;font-size:.85rem;max-width:200px}
.topbar .usr{font-size:.82rem;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--border);
  background:var(--card);color:var(--text);padding:.5rem .85rem;border-radius:6px;font-size:.85rem;font-weight:600}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--emerald);border-color:var(--emerald);color:#fff}
.btn.primary:hover{background:var(--emerald-d)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:.3rem .55rem;font-size:.78rem}
.content{padding:1.2rem;max-width:1200px;width:100%}

/* ===== Cards / KPIs ===== */
.grid{display:grid;gap:1rem}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:1rem 1.1rem;box-shadow:var(--shadow)}
.card h3{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .val{font-size:1.7rem;font-weight:800;color:var(--navy);margin-top:.2rem}
.kpi .val.em{color:var(--emerald)} .kpi .val.tl{color:var(--teal)}
.kpi .sub{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.section-title{font-size:1.05rem;color:var(--navy);font-weight:700;margin:0 0 .8rem}

/* ===== Tables ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:520px}
th,td{text-align:left;padding:.6rem .7rem;border-bottom:1px solid var(--border);white-space:nowrap}
th{background:var(--navy);color:#fff;font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:#f8fafc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.twrap{white-space:normal;max-width:240px}

/* ===== Badges ===== */
.badge{display:inline-block;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border-radius:999px}
.badge.green{background:#e3f5ec;color:var(--emerald-d)}
.badge.blue{background:#e3eef5;color:var(--teal)}
.badge.gray{background:#e9edf1;color:var(--muted)}
.badge.amber{background:#fbf0da;color:var(--warn)}
.badge.red{background:#fbe5e2;color:var(--danger)}

/* ===== Forms ===== */
.form-row{display:grid;gap:.7rem 1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:.8rem}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.25rem;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:.5rem .6rem;border:1px solid var(--border);
  border-radius:6px;background:#fff;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(31,122,140,.15)}
.form-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.4rem}
.hint{font-size:.78rem;color:var(--muted);margin-top:.2rem}

/* ===== Modal ===== */
.modal-back{position:fixed;inset:0;background:rgba(10,31,51,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:5vh 1rem;z-index:100;overflow-y:auto}
.modal{background:var(--card);border-radius:12px;max-width:560px;width:100%;box-shadow:var(--shadow-lg);
  animation:rise .15s ease-out}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{padding:1rem 1.2rem;border-bottom:1px solid var(--border);display:flex;align-items:center}
.modal-head h2{font-size:1.05rem;color:var(--navy);flex:1}
.modal-head .x{background:none;border:none;font-size:1.3rem;color:var(--muted)}
.modal-body{padding:1.2rem}
.modal-foot{padding:.8rem 1.2rem;border-top:1px solid var(--border);display:flex;gap:.6rem;justify-content:flex-end}

/* ===== Toast ===== */
.toast-wrap{position:fixed;bottom:1rem;right:1rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--navy);color:#fff;padding:.7rem 1rem;border-radius:8px;font-size:.85rem;
  box-shadow:var(--shadow-lg);max-width:340px;animation:rise .15s ease-out;border-left:4px solid var(--emerald)}
.toast.err{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}

/* ===== Auth ===== */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;
  background:linear-gradient(135deg,var(--navy) 0%,var(--navy-l) 100%)}
.auth-card{background:var(--card);border-radius:14px;max-width:430px;width:100%;padding:2rem;box-shadow:var(--shadow-lg)}
.auth-card .logo{font-size:1.5rem;font-weight:800;color:var(--navy)}
.auth-card .logo span{color:var(--emerald)}
.auth-card .tag{color:var(--muted);font-size:.88rem;margin:.3rem 0 1.3rem}
.note{background:#eef5f1;border-left:3px solid var(--emerald);padding:.7rem .9rem;border-radius:6px;
  font-size:.82rem;color:#234;margin:.8rem 0}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.empty .ic{font-size:2.4rem;margin-bottom:.5rem}
.pillrow{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
details.summary-box{background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:.8rem 1rem;margin:.6rem 0}
details.summary-box summary{cursor:pointer;font-weight:700;color:var(--navy)}
.muted{color:var(--muted)} .small{font-size:.8rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}

/* ===== Responsive ===== */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:-260px;top:0;width:240px;z-index:50;transition:left .2s;height:100vh}
  .app.nav-open .sidebar{left:0}
  .app.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .topbar .burger{display:block}
  .topbar .usr{display:none}
  .content{padding:.9rem}
}
@media (max-width:480px){
  .topbar .assoc-sel{max-width:130px;font-size:.78rem}
  .kpi .val{font-size:1.4rem}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-wrap"></div>
<script>
/* ===== EAMS — Ekub & Association Management System (client-side app) ===== */
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmt=n=>new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const today=()=>new Date().toISOString().slice(0,10);
const nowISO=()=>new Date().toISOString();
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='eams_db_v1'; const SK='eams_session';

const ACCT={CASH:'cash',LIAB:'members_liability',FEE:'fee_income',PEN:'penalty_income'};
const ACCT_NAME={cash:'Cash (Asset)',members_liability:"Members' Liability",fee_income:'Fee Income',penalty_income:'Penalty Income'};
const ACCT_KIND={cash:'asset',members_liability:'liability',fee_income:'income',penalty_income:'income'};
const MODES={traditional_pool:'Traditional Pool',equal_rounds:'Equal Rounds',target_entitlement:'Target Entitlement'};
const SHARE={full:'Full',half:'Half',quarter:'Quarter',custom:'Custom'};

function initialDb(){return{version:1,settings:{setup:false,adminPin:null,adminName:'',activeAssociationId:null},
  associations:[],members:[],schemes:[],enrollments:[],contributions:[],draws:[],distributions:[],ledger:[],audit:[]};}
function loadDb(){try{return JSON.parse(localStorage.getItem(KEY))||initialDb()}catch(e){return initialDb()}}
function saveDb(){localStorage.setItem(KEY,JSON.stringify(DB))}
let DB=loadDb();
function session(){try{return JSON.parse(sessionStorage.getItem(SK))}catch(e){return null}}
function setSession(s){sessionStorage.setItem(SK,JSON.stringify(s))}
function clearSession(){sessionStorage.removeItem(SK)}

/* collection helpers */
function find(coll,id){return DB[coll].find(x=>x.id===id)}
function activeAssocId(){return DB.settings.activeAssociationId}
function activeAssoc(){return find('associations',activeAssocId())}
function assocFilter(arr){return arr.filter(x=>x.association_id===activeAssocId())}
function memberName(id){const m=find('members',id);return m?m.full_name:'—'}
function memberNo(id){const m=find('members',id);return m?m.member_no:'—'}
function schemeName(id){const s=find('schemes',id);return s?s.name:'—'}

function audit(action,refId){DB.audit.push({id:uid(),at:nowISO(),action,ref_id:refId,user:DB.settings.adminName||'admin'});}

/* ===== Double-entry ledger posting ===== */
function postTx(refType,refId,date,lines,desc){
  const txid=uid(); const aid=activeAssocId();
  lines.forEach(l=>{DB.ledger.push({id:uid(),tx_id:txid,association_id:aid,date,account:l.account,
    debit:+l.debit||0,credit:+l.credit||0,ref_type:refType,ref_id:refId,description:desc});});
}
function acctBalances(){
  const b={cash:0,members_liability:0,fee_income:0,penalty_income:0};
  assocFilter(DB.ledger).forEach(e=>{b[e.account]=(b[e.account]||0)+(+e.debit)-(+e.credit);});
  return b;
}
function ledgerTotals(){let d=0,c=0;assocFilter(DB.ledger).forEach(e=>{d+=+e.debit;c+=+e.credit;});return{debit:d,credit:c};}
function cashBalance(){return acctBalances().cash}
function totalCollected(){return assocFilter(DB.contributions).reduce((s,x)=>s+(+x.amount),0)}
function totalDistributed(){return assocFilter(DB.distributions).reduce((s,x)=>s+(+x.amount),0)}

/* ===== UI helpers: toast + modal ===== */
function toast(msg,type){
  const w=$('#toast-root'); const t=document.createElement('div');
  t.className='toast'+(type?' '+type:''); t.textContent=msg; w.appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s';t.style.opacity='0';setTimeout(()=>t.remove(),320);},2800);
}
function openModal(inner){
  const r=$('#modal-root');
  r.innerHTML='<div class="modal-back" data-close><div class="modal">'+inner+'</div></div>';
  document.body.style.overflow='hidden';
}
function closeModal(){$('#modal-root').innerHTML='';document.body.style.overflow='';}

/* ===== Members CRUD ===== */
function nextMemberNo(){let n=0;assocFilter(DB.members).forEach(m=>{const x=parseInt((m.member_no||'').replace(/\D/g,''),10);if(!isNaN(x)&&x>n)n=x;});return 'M'+String(n+1).padStart(4,'0');}
function addMember(d){const id=uid();DB.members.push({id,association_id:activeAssocId(),member_no:d.member_no||nextMemberNo(),full_name:d.full_name,phone:d.phone||'',email:d.email||'',id_no:d.id_no||'',status:'active',joined_at:today()});audit('member.create',id);saveDb();return id;}
function updateMember(id,d){const m=find('members',id);if(!m)return;Object.assign(m,d);audit('member.update',id);saveDb();}
function deleteMember(id){if(DB.enrollments.some(e=>e.member_id===id)){toast('Cannot delete: member is enrolled in a scheme','err');return false;}DB.members=DB.members.filter(m=>m.id!==id);audit('member.delete',id);saveDb();return true;}

/* ===== Schemes CRUD ===== */
function addScheme(d){const id=uid();DB.schemes.push({id,association_id:activeAssocId(),name:d.name,code:d.code||'',type:d.type||'ekub',distribution_mode:d.distribution_mode||'equal_rounds',round_value:+d.round_value||0,contribution_amount:+d.contribution_amount||0,total_rounds:+d.total_rounds||0,contribution_frequency:d.contribution_frequency||'monthly',start_date:d.start_date||today(),status:'active',drawn_rounds:[],created_at:today()});audit('scheme.create',id);saveDb();return id;}
function updateScheme(id,d){const s=find('schemes',id);if(!s)return;Object.assign(s,d);audit('scheme.update',id);saveDb();}
function closeScheme(id){const s=find('schemes',id);if(!s)return;s.status='closed';audit('scheme.close',id);saveDb();}

/* ===== Enrollments ===== */
function enrollMember(schemeId,memberId,target,shareType){const id=uid();const tgt=+target||0;DB.enrollments.push({id,association_id:activeAssocId(),scheme_id:schemeId,member_id:memberId,share_type:shareType||'custom',target_amount:tgt,remaining_target:tgt,total_received:0,rounds_received:0,status:'active',joined_at:today()});audit('enrollment.create',id);saveDb();return id;}
function removeEnrollment(id){const e=find('enrollments',id);if(!e)return false;if(e.total_received>0){toast('Cannot remove: member already received a distribution','err');return false;}DB.enrollments=DB.enrollments.filter(x=>x.id!==id);audit('enrollment.delete',id);saveDb();return true;}

/* ===== Contributions ===== */
function collectRound(schemeId,roundNo){
  const sch=find('schemes',schemeId);if(!sch||sch.status==='closed')return 0;const rn=+roundNo;
  // Classic rotating Ekub: every enrolled member contributes every round until the scheme closes.
  const ens=assocFilter(DB.enrollments).filter(e=>e.scheme_id===schemeId);
  let made=0;
  ens.forEach(e=>{
    if(DB.contributions.some(c=>c.scheme_id===schemeId&&c.member_id===e.member_id&&c.round_no===rn))return;
    const id=uid(); const amt=sch.contribution_amount;
    DB.contributions.push({id,association_id:activeAssocId(),scheme_id:schemeId,member_id:e.member_id,round_no:rn,amount:amt,method:'cash',reference:'Round '+rn+' collection',paid_date:today(),status:'paid'});
    postTx('contribution',id,today(),[{account:ACCT.CASH,debit:amt},{account:ACCT.LIAB,credit:amt}],'Contribution R'+rn+' — '+memberName(e.member_id));
    made++;
  });
  audit('contribution.collectRound',schemeId); saveDb(); return made;
}
function addContribution(d){const id=uid();const amt=+d.amount;DB.contributions.push({id,association_id:activeAssocId(),scheme_id:d.scheme_id,member_id:d.member_id,round_no:+d.round_no,amount:amt,method:d.method||'cash',reference:d.reference||'',paid_date:d.paid_date||today(),status:'paid'});postTx('contribution',id,d.paid_date||today(),[{account:ACCT.CASH,debit:amt},{account:ACCT.LIAB,credit:amt}],'Contribution R'+d.round_no+' — '+memberName(d.member_id));audit('contribution.create',id);saveDb();return id;}

/* ===== Draw / distribution engine (3 modes) ===== */
function runDraw(schemeId,roundNo){
  const sch=find('schemes',schemeId); if(!sch){toast('Scheme not found','err');return;}
  if(sch.status==='closed'){toast('Scheme is closed','err');return;}
  const rn=+roundNo;
  const rc=assocFilter(DB.contributions).filter(c=>c.scheme_id===schemeId&&c.round_no===rn);
  const pool=rc.reduce((s,c)=>s+(+c.amount),0);
  if(pool<=0){toast('No contributions for round '+rn+'. Collect the round first.','warn');return;}
  if((sch.drawn_rounds||[]).includes(rn)){toast('Round '+rn+' already drawn','warn');return;}
  const paidIds=new Set(rc.map(c=>c.member_id));
  let eligible=assocFilter(DB.enrollments).filter(e=>e.scheme_id===schemeId&&e.status==='active'&&e.remaining_target>0&&paidIds.has(e.member_id));
  if(!eligible.length){toast('No eligible members (paid members all reached target)','warn');return;}
  const payouts=[];
  if(sch.distribution_mode==='traditional_pool'){
    const w=eligible[Math.floor(Math.random()*eligible.length)];
    payouts.push({member_id:w.member_id,amount:Math.min(pool,w.remaining_target)});
  } else if(sch.distribution_mode==='equal_rounds'){
    let rem=pool; const remT={}; eligible.forEach(e=>remT[e.id]=e.remaining_target);
    while(rem>0){
      const elig=eligible.filter(e=>remT[e.id]>0);
      if(!elig.length)break;
      const w=elig[Math.floor(Math.random()*elig.length)];
      const amt=Math.min(sch.round_value,remT[w.id],rem);
      if(amt<=0)break;
      payouts.push({member_id:w.member_id,amount:amt}); remT[w.id]-=amt; rem-=amt;
    }
  } else { /* target_entitlement */
    let rem=pool; const sorted=[...eligible].sort((a,b)=>a.remaining_target-b.remaining_target);
    for(const w of sorted){ if(rem<=0)break; const amt=Math.min(w.remaining_target,rem); if(amt<=0)continue; payouts.push({member_id:w.member_id,amount:amt}); rem-=amt; }
  }
  const date=today();
  payouts.forEach(p=>{
    const en=DB.enrollments.find(e=>e.scheme_id===schemeId&&e.member_id===p.member_id);
    const drawId=uid();
    DB.draws.push({id:drawId,association_id:activeAssocId(),scheme_id:schemeId,round_no:rn,draw_date:date,winner_id:p.member_id,amount:p.amount,mode:sch.distribution_mode});
    const distId=uid();
    DB.distributions.push({id:distId,association_id:activeAssocId(),scheme_id:schemeId,draw_id:drawId,member_id:p.member_id,round_no:rn,amount:p.amount,distributed_date:date,status:'paid'});
    postTx('distribution',distId,date,[{account:ACCT.LIAB,debit:p.amount},{account:ACCT.CASH,credit:p.amount}],'Distribution R'+rn+' — '+memberName(p.member_id));
    if(en){en.total_received+=p.amount; en.remaining_target=Math.max(0,en.remaining_target-p.amount); en.rounds_received+=1; if(en.remaining_target<=0)en.status='completed';}
  });
  if(!sch.drawn_rounds)sch.drawn_rounds=[];
  sch.drawn_rounds.push(rn);
  const activeLeft=assocFilter(DB.enrollments).filter(e=>e.scheme_id===schemeId&&e.status==='active').length;
  if(activeLeft===0||sch.drawn_rounds.length>=sch.total_rounds)sch.status='closed';
  audit('draw.run',schemeId); saveDb();
  toast('Round '+rn+' drawn: '+payouts.length+' winner(s), ETB '+fmt(payouts.reduce((s,p)=>s+p.amount,0)));
}
/* ===== Modal form helper ===== */
function modalForm(title,bodyHtml,submitLabel,formKey,idAttr){
  return `<div class="modal-head"><h2>${esc(title)}</h2><button type="button" class="x" data-action="modal.close">×</button></div>
    <form data-form="${formKey}" data-id="${idAttr||''}"><div class="modal-body">${bodyHtml}</div>
    <div class="modal-foot"><button type="button" class="btn ghost" data-action="modal.close">Cancel</button>
    <button type="submit" class="btn primary">${esc(submitLabel)}</button></div></form>`;
}
function formVals(form){const o={};new FormData(form).forEach((v,k)=>o[k]=v);return o;}
function schemeBadge(s){return s.status==='closed'?'<span class="badge gray">Closed</span>':'<span class="badge green">Active</span>';}

/* ===== Auth: setup + login ===== */
function viewSetup(){
  return `<div class="auth"><div class="auth-card">
    <div class="logo">E<span>AMS</span></div><div class="tag">Ekub &amp; Association Management System</div>
    <div class="note">First-time setup: create your association and an administrator PIN. All data stays in this browser.</div>

const NAV=[{r:'dashboard',label:'Dashboard',ic:'▦'},{r:'members',label:'Members',ic:'👤'},{r:'schemes',label:'Schemes',ic:'🏧'},{r:'contributions',label:'Contributions',ic:'💰'},{r:'ledger',label:'Ledger',ic:'📚'},{r:'reports',label:'Reports',ic:'📊'},{r:'settings',label:'Settings',ic:'⚙'}];
function currentRoute(){return (location.hash.replace(/^#\/?/,'')||'dashboard');}
function navigate(r){location.hash='#/'+r;}
function viewApp(){

  const navHtml=NAV.map(n=>`<a data-nav="${n.r}" class="${r.startsWith(n.r)?'active':''}"><span class="ic">${n.ic}</span>${n.label}</a>`).join('');

    <div class="main"><header class="topbar">
      <button class="burger" id="burger">☰</button><h1 id="pageTitle">—</h1>
      <select class="assoc-sel" id="assocSwitch">${DB.associations.map(a=>`<option value="${a.id}" ${a.id===activeAssocId()?'selected':''}>${esc(a.name)}</option>`).join('')}</select>

      <button class="btn ghost sm" data-action="app.logout">Logout</button>

}
function renderView(){
  const r=currentRoute(); const p=r.split('/');
  let title='Dashboard', html=viewDashboard();
  if(p[0]==='members'){title='Members';html=viewMembers();}
  else if(p[0]==='schemes'){title='Schemes';html=viewSchemes();}
  else if(p[0]==='scheme'){title='Scheme Detail';html=viewSchemeDetail(p[1]);}
  else if(p[0]==='contributions'){title='Contributions';html=viewContributions();}
  else if(p[0]==='ledger'){title='Ledger & Books';html=viewLedger();}
  else if(p[0]==='reports'){title='Reports';html=viewReports();}
  else if(p[0]==='settings'){title='Settings';html=viewSettings();}
  const v=$('#view'); if(v)v.innerHTML=html;

  $$('.nav a[data-nav]').forEach(a=>a.classList.toggle('active',r.startsWith(a.dataset.nav)));
}
function afterRender(){
  $('#burger').onclick=()=>$('#appShell').classList.toggle('nav-open');
  $$('.nav a[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#appShell').classList.remove('nav-open');navigate(a.dataset.nav);});
  const sw=$('#assocSwitch'); if(sw)sw.onchange=e=>{DB.settings.activeAssociationId=e.target.value;saveDb();navigate('dashboard');render();};
  renderView();
}

function viewSchemeDetail(id){
  const s=find('schemes',id); if(!s)return '<div class="empty">Scheme not found.</div>';
  const ens=assocFilter(DB.enrollments).filter(e=>e.scheme_id===id);
  const col=assocFilter(DB.contributions).filter(c=>c.scheme_id===id).reduce((a,c)=>a+(+c.amount),0);
  const dist=assocFilter(DB.distributions).filter(d=>d.scheme_id===id).reduce((a,d)=>a+(+d.amount),0);
  const drawn=s.drawn_rounds||[];
  let rows='';
  for(let r=1;r<=s.total_rounds;r++){
    const pool=assocFilter(DB.contributions).filter(c=>c.scheme_id===id&&c.round_no===r).reduce((a,c)=>a+(+c.amount),0);
    const isDrawn=drawn.includes(r);
    const winners=assocFilter(DB.draws).filter(d=>d.scheme_id===id&&d.round_no===r).map(d=>`${esc(memberName(d.winner_id))} (${fmt(d.amount)})`).join(', ')||'—';

    rows+=`<tr><td>R${r}</td><td class="num">${fmt(pool)}</td><td>${isDrawn?'<span class="badge green">Drawn</span>':'<span class="badge amber">Pending</span>'}</td><td class="twrap">${winners}</td><td>${acts}</td></tr>`;
  }
  return `<section><div class="between"><div><div class="section-title" style="margin:0">${esc(s.name)} ${schemeBadge(s)}</div>

      <div class="card kpi"><h3>Pool Remaining</h3><div class="val">${fmt(col-dist)}</div></div>
      <div class="card kpi"><h3>Enrolled</h3><div class="val">${ens.length}</div><div class="sub">${ens.filter(e=>e.status==='active').length} active · ${ens.filter(e=>e.status==='completed').length} done</div></div>
    </div>
    <div class="between"><div class="section-title" style="margin:0">Enrolled Members</div>
      ${s.status==='active'?`<button class="btn primary sm" data-action="enroll.add" data-id="${id}">+ Enroll Member</button>`:''}</div>
    ${ens.length?`<div class="table-wrap" style="margin-bottom:1rem"><table><thead><tr><th>Member</th><th>Share</th><th class="num">Target</th><th class="num">Received</th><th class="num">Remaining</th><th class="num">Won</th><th>Status</th><th></th></tr></thead><tbody>
      ${ens.map(e=>`<tr><td>${esc(memberName(e.member_id))}</td><td><span class="badge gray">${esc(SHARE[e.share_type]||e.share_type)}</span></td><td class="num">${fmt(e.target_amount)}</td><td class="num">${fmt(e.total_received)}</td><td class="num">${fmt(e.remaining_target)}</td><td class="num">${e.rounds_received}</td><td>${e.status==='completed'?'<span class="badge green">Completed</span>':'<span class="badge blue">Active</span>'}</td><td>${e.total_received>0?'':`<button class="btn sm danger" data-action="enroll.del" data-id="${e.id}">Remove</button>`}</td></tr>`).join('')}</tbody></table></div>`
      :'<div class="empty small">No members enrolled yet.</div>'}

}

function viewLedger(){
  const b=acctBalances(), tot=ledgerTotals();
  const entries=assocFilter(DB.ledger).slice().sort((a,b)=>String(b.date).localeCompare(a.date)||String(b.id).localeCompare(a.id));
  const accts=[['cash','Cash (Asset)','asset'],['members_liability',"Members' Liability",'liability'],['fee_income','Fee Income','income'],['penalty_income','Penalty Income','income']];
  const tb=accts.map(([k,n,kind])=>{let d=0,c=0;assocFilter(DB.ledger).filter(e=>e.account===k).forEach(e=>{d+=+e.debit;c+=+e.credit;});return `<tr><td>${esc(n)}</td><td>${esc(kind)}</td><td class="num">${fmt(d)}</td><td class="num">${fmt(c)}</td><td class="num">${fmt(d-c)}</td></tr>`;}).join('');
  const assets=b.cash, liabilities=-b.members_liability, income=-(b.fee_income+b.penalty_income);
  const bal1=Math.abs(tot.debit-tot.credit)<0.001, bal2=Math.abs(assets-(liabilities+income))<0.001;
  return `<section><div class="section-title">Trial Balance</div>
  <div class="table-wrap"><table><thead><tr><th>Account</th><th>Type</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Net (Dr−Cr)</th></tr></thead><tbody>${tb}
    <tr style="font-weight:700;background:#eef5f1"><td>Total</td><td></td><td class="num">${fmt(tot.debit)}</td><td class="num">${fmt(tot.credit)}</td><td class="num">${fmt(tot.debit-tot.credit)}</td></tr></tbody></table></div>
  <div class="small" style="margin:.4rem 0 1rem">${bal1?'<span class="badge green">✓ Balanced — total debits = total credits</span>':'<span class="badge red">Out of balance</span>'}</div>
  <div class="section-title">Balance Sheet</div>
  <div class="table-wrap"><table><thead><tr><th>Section</th><th>Account</th><th class="num">Amount</th></tr></thead><tbody>
    <tr><td>Assets</td><td>Cash</td><td class="num">${fmt(assets)}</td></tr>
    <tr><td>Liabilities</td><td>Members' Liability</td><td class="num">${fmt(liabilities)}</td></tr>
    <tr><td>Income</td><td>Fee + Penalty Income</td><td class="num">${fmt(income)}</td></tr>
    <tr style="font-weight:700;background:#eef5f1"><td colspan="2">Assets − (Liabilities + Income)</td><td class="num">${fmt(assets-liabilities-income)}</td></tr></tbody></table></div>
  <div class="small" style="margin:.4rem 0 1rem">${bal2?'<span class="badge green">✓ Balanced — Assets = Liabilities + Income</span>':'<span class="badge red">Out of balance</span>'}</div>
  <div class="section-title">Ledger Entries <span class="muted small">(${entries.length})</span></div>
  ${entries.length?`<div class="table-wrap"><table><thead><tr><th>Date</th><th>Account</th><th class="num">Debit</th><th class="num">Credit</th><th>Description</th></tr></thead><tbody>
    ${entries.map(e=>`<tr><td>${e.date}</td><td>${esc(ACCT_NAME[e.account]||e.account)}</td><td class="num">${e.debit?fmt(e.debit):''}</td><td class="num">${e.credit?fmt(e.credit):''}</td><td class="twrap">${esc(e.description)}</td></tr>`).join('')}</tbody></table></div>`
    :'<div class="empty small">No ledger entries.</div>'}
  </section>`;
}
function viewReports(){
  const ss=assocFilter(DB.schemes);
  const schRows=ss.map(s=>{const col=assocFilter(DB.contributions).filter(c=>c.scheme_id===s.id).reduce((a,c)=>a+(+c.amount),0);const dist=assocFilter(DB.distributions).filter(d=>d.scheme_id===s.id).reduce((a,d)=>a+(+d.amount),0);const ens=assocFilter(DB.enrollments).filter(e=>e.scheme_id===s.id);return `<tr><td>${esc(s.name)}</td><td>${esc(MODES[s.distribution_mode])}</td><td class="num">${ens.length}</td><td class="num">${ens.filter(e=>e.status==='completed').length}</td><td class="num">${fmt(col)}</td><td class="num">${fmt(dist)}</td><td class="num">${fmt(col-dist)}</td><td>${schemeBadge(s)}</td></tr>`;}).join('');
  const ms=assocFilter(DB.members);
  const memStmt=ms.map(m=>{const paid=assocFilter(DB.contributions).filter(c=>c.member_id===m.id).reduce((a,c)=>a+(+c.amount),0);const recv=assocFilter(DB.distributions).filter(d=>d.member_id===m.id).reduce((a,d)=>a+(+d.amount),0);return `<tr><td>${esc(m.member_no)}</td><td>${esc(m.full_name)}</td><td class="num">${fmt(paid)}</td><td class="num">${fmt(recv)}</td><td class="num">${fmt(paid-recv)}</td></tr>`;}).join('');
  return `<section><div class="section-title">Scheme Summary</div>
  ${ss.length?`<div class="table-wrap"><table><thead><tr><th>Scheme</th><th>Mode</th><th class="num">Members</th><th class="num">Done</th><th class="num">Collected</th><th class="num">Distributed</th><th class="num">Remaining</th><th>Status</th></tr></thead><tbody>${schRows}</tbody></table></div>`:'<div class="empty small">No schemes.</div>'}
  <div class="section-title" style="margin-top:1.2rem">Member Statements</div>
  ${ms.length?`<div class="table-wrap"><table><thead><tr><th>No.</th><th>Name</th><th class="num">Contributed</th><th class="num">Received</th><th class="num">Net (paid − recv)</th></tr></thead><tbody>${memStmt}</tbody></table></div>`:'<div class="empty small">No members.</div>'}
  </section>`;
}

  <div class="card" style="margin-bottom:1rem"><div class="row"><div><div class="section-title" style="margin:0">${esc(a?a.name:'—')}</div>
    <div class="small muted">${a?esc(a.code||'')+' · '+esc(a.currency||'ETB'):''}<br>${a?esc(a.address||'—')+' · '+esc(a.phone||''):''}</div></div>
    <button class="btn sm" data-action="assoc.add">+ New Association</button></div></div>
  <div class="section-title">Data Management</div>
  <div class="card" style="margin-bottom:1rem"><p class="small muted" style="margin-bottom:.8rem">All data is stored locally in this browser (localStorage). Export regularly to keep a backup or move data to another browser.</p>
    <div class="row">

  <div class="section-title">Documentation</div>
  <div class="card"><div class="small muted" style="margin-bottom:.6rem">Reference design documents (in this repository):</div>
    <div class="row">
      <a class="btn sm" href="docs/EAMS_Technical_Design.pdf" target="_blank">Technical Design</a>
      <a class="btn sm" href="docs/EAMS_UI_Wireframes.pdf" target="_blank">Wireframes</a>
      <a class="btn sm" href="docs/EAMS_Test_Cases.xlsx" target="_blank">Test Cases</a>
      <a class="btn sm" href="docs/EAMS_Deployment_Guide.pdf" target="_blank">Deployment Guide</a>

/* ===== Demo data, export/import, pin, association ===== */

  DB.settings={setup:true,adminPin:'1234',adminName:'Demo Admin',activeAssociationId:aid};
  const names=['Abebe Kebede','Sara Tesfaye','Dawit Bekele','Helen Alemu','Yonas Girma','Marta Assefa','Solomon Haile','Liya Tadesse'];
  const mids=names.map((nm,i)=>{const id=uid();DB.members.push({id,association_id:aid,member_no:'M'+String(i+1).padStart(4,'0'),full_name:nm,phone:'+251 91'+(1000000+i),email:'',id_no:'ID-'+(1000+i),status:'active',joined_at:today()});return id;});
  const sid=uid();
  DB.schemes.push({id:sid,association_id:aid,name:'Monthly Iqub — Q1',code:'IQ-Q1',type:'ekub',distribution_mode:'equal_rounds',round_value:2000,contribution_amount:1000,total_rounds:8,contribution_frequency:'monthly',start_date:today(),status:'active',drawn_rounds:[],created_at:today()});
  mids.forEach(mid=>DB.enrollments.push({id:uid(),association_id:aid,scheme_id:sid,member_id:mid,share_type:'full',target_amount:8000,remaining_target:8000,total_received:0,rounds_received:0,status:'active',joined_at:today()}));
  collectRound(sid,1); runDraw(sid,1);

function exportData(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='eams-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('Data exported');}
function importData(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.version)throw new Error('bad');DB=d;saveDb();toast('Data imported');render();}catch(e){toast('Invalid backup file','err');}};r.readAsText(file);}
function doChangePin(v){if(String(v.old)!==String(DB.settings.adminPin)){toast('Current PIN is wrong','err');return;}if(String(v.new)!==String(v.confirm)){toast('New PINs do not match','err');return;}DB.settings.adminPin=String(v.new);saveDb();toast('PIN changed');}
function addAssociation(v){const id=uid();DB.associations.push({id,name:v.name,code:v.code||'',currency:v.currency||'ETB',address:v.address||'',phone:v.phone||'',email:v.email||'',created_at:today()});DB.settings.activeAssociationId=id;audit('association.create',id);saveDb();}
function openChangePinForm(){const body=`<div class="form-row"><div class="field"><label>Current PIN</label><input name="old" inputmode="numeric" required></div><div class="field"><label>New PIN (4-6 digits)</label><input name="new" inputmode="numeric" required pattern="[0-9]{4,6}"></div><div class="field"><label>Confirm New PIN</label><input name="confirm" inputmode="numeric" required></div></div>`;openModal(modalForm('Change PIN',body,'Update','changePin',''));}
function openAssociationForm(){const body=`<div class="form-row"><div class="field"><label>Name *</label><input name="name" required></div><div class="field"><label>Code</label><input name="code"></div><div class="field"><label>Currency</label><select name="currency"><option>ETB</option><option>USD</option><option>KES</option><option>NGN</option></select></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Email</label><input name="email"></div><div class="field"><label>Address</label><input name="address"></div></div>`;openModal(modalForm('New Association',body,'Create','association',''));}

/* ===== Action dispatcher ===== */
function onAction(el){
  const a=el.dataset.action, id=el.dataset.id, round=el.dataset.round;
  switch(a){
    case 'modal.close': closeModal(); return;
    case 'app.logout': clearSession(); closeModal(); render(); return;
    case 'member.add': openMemberForm(); return;
    case 'member.edit': openMemberForm(id); return;
    case 'member.del': if(confirm('Delete this member?')){deleteMember(id);renderView();} return;
    case 'scheme.add': openSchemeForm(); return;
    case 'scheme.edit': openSchemeForm(id); return;
    case 'scheme.open': navigate('scheme/'+id); renderView(); return;
    case 'scheme.close': if(confirm('Close this scheme? It can no longer accept draws.')){closeScheme(id);renderView();} return;
    case 'enroll.add': openEnrollForm(id); return;
    case 'enroll.del': if(confirm('Remove this enrollment?')){removeEnrollment(id);renderView();} return;
    case 'contrib.add': openContributionForm(); return;
    case 'round.collect': collectRound(id,round); renderView(); return;
    case 'round.draw': runDraw(id,round); renderView(); return;
    case 'settings.demo': loadDemo(); render(); return;
    case 'data.export': exportData(); return;
    case 'data.import': $('#importFile')&&$('#importFile').click(); return;
    case 'data.reset': if(confirm('Erase ALL data? This cannot be undone.')){DB=initialDb();saveDb();clearSession();render();} return;
    case 'settings.pin': openChangePinForm(); return;
    case 'assoc.add': openAssociationForm(); return;
  }
}

/* ===== Render + bootstrap ===== */
function render(){
  const root=$('#root');
  if(!DB.settings.setup){root.innerHTML=viewSetup();return;}
  const s=session();
  if(!s||!s.loggedIn){root.innerHTML=viewLogin();setTimeout(()=>{const p=$('#loginPin');if(p)p.focus();},60);return;}
  root.innerHTML=viewApp();
  afterRender();
}
function boot(){
  document.addEventListener('click',e=>{
    if(e.target.classList.contains('modal-back')){closeModal();return;}
    const el=e.target.closest('[data-action]'); if(el)onAction(el);
  });
  document.addEventListener('submit',e=>{
    const f=e.target.closest('[data-form]'); if(!f)return; e.preventDefault();
    const v=formVals(f), key=f.dataset.form, id=f.dataset.id; let full=false;
    try{
      if(key==='member'){if(id)updateMember(id,v);else addMember(v);toast('Member saved');}
      else if(key==='scheme'){if(id)updateScheme(id,v);else addScheme(v);toast('Scheme saved');}
      else if(key==='enroll'){enrollMember(v.scheme_id,v.member_id,v.target_amount,v.share_type);toast('Member enrolled');}
      else if(key==='contribution'){addContribution(v);toast('Contribution recorded');}
      else if(key==='collectRound'){const n=collectRound(v.scheme_id,v.round_no);toast(n?n+' contributions recorded':'Already collected');}
      else if(key==='drawRound'){runDraw(v.scheme_id,v.round_no);}
      else if(key==='setup'){doSetup(v);full=true;}
      else if(key==='login'){doLogin(v);full=true;}
      else if(key==='changePin'){doChangePin(v);}
      else if(key==='association'){addAssociation(v);full=true;}
    }catch(err){toast('Error: '+err.message,'err');}
    closeModal();
    if(full)render(); else renderView();
  });
  document.addEventListener('input',e=>{const s=e.target.closest('#memSearch');if(!s)return;const q=s.value.toLowerCase();$$('#memTable tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none');});
  document.addEventListener('change',e=>{const f=e.target.closest('#importFile');if(!f)return;if(f.files&&f.files[0])importData(f.files[0]);});
  window.addEventListener('hashchange',()=>{if(DB.settings.setup&&session()&&session().loggedIn)renderView();});
  render();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
